# Header bảo mật cho SPA (founderai.biz) — file này được COPY vào
# /etc/nginx/snippets/uknow-security-headers.conf và `include` trong TỪNG location tĩnh
# của nginx.conf.
#
# Vì sao phải include theo từng location, không đặt một lần ở server: nginx KHÔNG kế thừa
# `add_header` từ cấp trên khi block con có `add_header` riêng (các location tĩnh đều có
# Cache-Control). Đặt ở server thì 4 location tĩnh mất sạch header bảo mật mà không báo gì.
#
# Không include ở các location proxy_pass (/api/, /t/, /file/...): backend đã gắn bộ header
# này qua helmet (backend/src/app.js), include nữa là trùng header.
#
# HSTS giữ ĐÚNG giá trị helmet của backend đang gửi trên /api (includeSubDomains + preload)
# để trình duyệt không nhận hai chính sách khác nhau từ cùng một host.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# SPA không dùng camera/micro (grep getUserMedia|mediaDevices trong frontend/src: 0 kết quả, 03/10/2026).
# Không khoá geolocation: landing HTML của khách render trong iframe srcdoc kế thừa policy này,
# bản đồ nhúng "định vị tôi" sẽ hỏng.
add_header Permissions-Policy "camera=(), microphone=()" always;
# Chặn nhúng iframe từ origin khác, TRỪ các trang khách cố ý nhúng lên site của họ
# (/chat/:id chatbot, /f/:key biểu mẫu, /embed/lead-form cũ) — xem map $uknow_frame_ancestors
# trong nginx.conf. Giá trị rỗng → nginx bỏ qua header.
add_header Content-Security-Policy $uknow_frame_ancestors always;
add_header X-Frame-Options $uknow_x_frame_options always;
