services:
  postgres-e2e:
    # Cần pgvector cho help_article_chunks / kb_chunks (cosine search).
    image: pgvector/pgvector:pg15
    container_name: uknow-postgres-e2e
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uknow_campaign_test
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      # Cổng máy chủ đổi được, phòng khi đã có Postgres cài thẳng chiếm 5433:
      #   E2E_PG_PORT=5434 docker compose up -d
      # Đổi thì nhớ sửa DB_PORT trong e2e/.env.test cho khớp.
      - '${E2E_PG_PORT:-5433}:5432'
    volumes:
      - uknow-pg-e2e-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d uknow_campaign_test']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  uknow-pg-e2e-data:
