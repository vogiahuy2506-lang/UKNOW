name: Test Backend

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'

concurrency:
  group: test-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-sync-check:
    name: Schema sync (migrations ↔ bootstrap.sql)
    runs-on: ubuntu-latest
    # Chạy cho CẢ push (kể cả thẳng vào main) lẫn PR.
    # Trước đây giới hạn ở pull_request nên với lối làm việc push thẳng vào main,
    # job này skip vĩnh viễn — cổng gác cho đúng vấn đề hay xảy ra nhất mà chưa
    # từng chạy lần nào (đã dính lệch schema 4 lần chỉ trong ngày 04/08/2026).
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migration mới phải được mirror vào bootstrap.sql
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1 || true
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            # Nhánh mới / force-push: before toàn số 0 → so với commit cha.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1...HEAD"
            else
              RANGE="$BEFORE...HEAD"
            fi
          fi

          CHANGED=$(git diff --name-only $RANGE || true)
          MIGRATIONS=$(echo "$CHANGED" | grep '^backend/migrations/.*\.sql$' || true)
          BOOTSTRAP=$(echo "$CHANGED" | grep '^backend/tests/integration/sql/bootstrap.sql$' || true)

          if [ -z "$MIGRATIONS" ]; then
            echo "Khong co migration nao thay doi."
            exit 0
          fi

          # Chi bat buoc mirror khi migration THEM BANG / THEM COT / THEM EXTENSION —
          # do moi la thu lam bootstrap.sql lech va khien integration test do.
          # Migration chi them index / comment / UPDATE du lieu thi khong can.
          NEEDS_MIRROR=""
          for f in $MIGRATIONS; do
            [ -f "$f" ] || continue
            if grep -qiE 'CREATE TABLE|ADD COLUMN|CREATE EXTENSION' "$f"; then
              NEEDS_MIRROR="$NEEDS_MIRROR $f"
            fi
          done

          if [ -z "$NEEDS_MIRROR" ]; then
            echo "Migration thay doi nhung khong them bang/cot — khong can mirror."
            exit 0
          fi

          if [ -n "$BOOTSTRAP" ]; then
            echo "Co migration them bang/cot VA bootstrap.sql da duoc sua."
            exit 0
          fi

          echo "::error::Migration them bang/cot nhung KHONG sua backend/tests/integration/sql/bootstrap.sql"
          echo ""
          echo "Cac migration can mirror:"
          for f in $NEEDS_MIRROR; do echo "  - $f"; done
          echo ""
          echo "Vi sao chan: bootstrap.sql la schema dung DB test. Lech voi migration thi"
          echo "integration test hoac do, hoac XANH GIA (test khong cham cot moi)."
          echo "Sua: them bang/cot tuong ung vao bootstrap.sql roi commit lai."
          exit 1

  unit:
    name: Jest unit (backend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest (unit)
        run: npm run test:unit -- --ci

  lint:
    name: ESLint (backend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cổng gác lỗi cấu trúc: no-dupe-class-members (2 _parseJson trùng đã gây bug 500),
      # no-unreachable, no-redeclare... Config: backend/.eslintrc.cjs.
      - name: Run ESLint
        run: npm run lint

  integration:
    name: Jest integration (backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uknow_campaign_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: uknow_campaign_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BULLMQ_ENABLED: 'false'
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest (integration + coverage)
        run: npm run test:coverage -- --ci

      - name: Coverage summary trên PR
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "### 📊 Coverage backend" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const fmt = (m) => \`\${m.pct.toString().padStart(6)}%  (\${m.covered}/\${m.total})\`;
              console.log('Statements:', fmt(c.statements));
              console.log('Branches  :', fmt(c.branches));
              console.log('Functions :', fmt(c.functions));
              console.log('Lines     :', fmt(c.lines));
            " >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "(coverage-summary.json không tồn tại — kiểm tra config Jest)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifact
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7
          if-no-files-found: warn
