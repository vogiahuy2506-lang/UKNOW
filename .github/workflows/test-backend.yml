name: Test Backend

on:
  workflow_call:
    inputs:
      skip_integration:
        description: 'Bỏ qua integration test matrix (fast-path cho hotfix deploy — mặc định vẫn chạy đủ)'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      skip_integration:
        description: 'Bỏ qua integration test matrix (fast-path cho hotfix deploy — mặc định vẫn chạy đủ)'
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]

concurrency:
  group: test-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-sync-check:
    name: Schema sync (migrations ↔ bootstrap.sql)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Chạy cho CẢ push (kể cả thẳng vào main) lẫn PR.
    # Trước đây giới hạn ở pull_request nên với lối làm việc push thẳng vào main,
    # job này skip vĩnh viễn — cổng gác cho đúng vấn đề hay xảy ra nhất mà chưa
    # từng chạy lần nào (đã dính lệch schema 4 lần chỉ trong ngày 04/08/2026).
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migration mới phải được mirror vào bootstrap.sql
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual dispatch có thể chọn branch bất kỳ. So với main để không
            # bỏ sót migration đã thay đổi ở commit trước của branch.
            git fetch origin main
            git rev-parse --verify origin/main >/dev/null
            RANGE="origin/main...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            # Nhánh mới / force-push: before toàn số 0 → so với commit cha.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1...HEAD"
            else
              RANGE="$BEFORE...HEAD"
            fi
          fi

          CHANGED=$(git diff --name-only $RANGE || true)
          MIGRATIONS=$(echo "$CHANGED" | grep '^backend/migrations/.*\.sql$' || true)
          BOOTSTRAP=$(echo "$CHANGED" | grep '^backend/tests/integration/sql/bootstrap.sql$' || true)

          if [ -z "$MIGRATIONS" ]; then
            echo "Khong co migration nao thay doi."
            exit 0
          fi

          # Chi bat buoc mirror khi migration THEM BANG / THEM COT / THEM EXTENSION —
          # do moi la thu lam bootstrap.sql lech va khien integration test do.
          # Migration chi them index / comment / UPDATE du lieu thi khong can.
          NEEDS_MIRROR=""
          for f in $MIGRATIONS; do
            [ -f "$f" ] || continue
            if grep -qiE 'CREATE TABLE|ADD COLUMN|CREATE EXTENSION' "$f"; then
              NEEDS_MIRROR="$NEEDS_MIRROR $f"
            fi
          done

          if [ -z "$NEEDS_MIRROR" ]; then
            echo "Migration thay doi nhung khong them bang/cot — khong can mirror."
            exit 0
          fi

          if [ -n "$BOOTSTRAP" ]; then
            echo "Co migration them bang/cot VA bootstrap.sql da duoc sua."
            exit 0
          fi

          echo "::error::Migration them bang/cot nhung KHONG sua backend/tests/integration/sql/bootstrap.sql"
          echo ""
          echo "Cac migration can mirror:"
          for f in $NEEDS_MIRROR; do echo "  - $f"; done
          echo ""
          echo "Vi sao chan: bootstrap.sql la schema dung DB test. Lech voi migration thi"
          echo "integration test hoac do, hoac XANH GIA (test khong cham cot moi)."
          echo "Sua: them bang/cot tuong ung vao bootstrap.sql roi commit lai."
          exit 1

      - name: Kiểm tra an toàn migration (Immutability & Destructive DDL)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          MIGRATION_SAFETY_BASE_REF: main
        run: |
          cd backend
          node scripts/checkMigrationSafety.js

  unit:
    name: Jest unit (backend)
    timeout-minutes: 15
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest (unit)
        run: npm run test:unit -- --ci

  lint:
    name: ESLint (backend)
    timeout-minutes: 10
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cổng gác lỗi cấu trúc: no-dupe-class-members (2 _parseJson trùng đã gây bug 500),
      # no-unreachable, no-redeclare... Config: backend/.eslintrc.cjs.
      - name: Run ESLint
        run: npm run lint

      - name: Check encoding artifacts (CP437 Mojibake)
        run: |
          set -euo pipefail
          echo "Scanning source code for CP437 encoding corruption artifacts..."
          if grep -rnE "ΓÇ|≡ƒ|╞░|ß╗|┬·|├©" src ../frontend/src; then
            echo "::error::Found CP437 mojibake encoding corruption in source files. Please ensure files are encoded in UTF-8."
            exit 1
          fi
          echo "No CP437 encoding corruption found."

  integration:
    name: Jest integration (backend) — shard ${{ matrix.shard }}/4
    timeout-minutes: 25
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_integration }}

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uknow_campaign_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: uknow_campaign_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BULLMQ_ENABLED: 'false'
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Mỗi shard chạy trên Postgres service riêng của chính job đó (matrix = VM
      # riêng), không đụng shard khác. --shard chia theo SỐ LƯỢNG file test (không
      # cân theo thời gian chạy thật), nên 4 shard có thể lệch nhau vài phút —
      # chấp nhận được, vẫn nhanh hơn hẳn 1 lần chạy ~26 phút.
      #
      # Không sinh coverage ở đây nữa (trước đây integration job chạy test:coverage,
      # gộp cả unit lẫn integration coverage qua scripts/mergeCoverage.js). Gộp
      # coverage từ 4 shard song song cần thêm 1 job download-artifact + merge —
      # coverage report chỉ mang tính tham khảo trên PR summary, không gate gì,
      # nên đánh đổi lấy tốc độ + đơn giản. Cần lại thì xem lịch sử file này.
      - name: Run Jest (integration, shard ${{ matrix.shard }}/4)
        run: npm run test:integration -- --ci --shard=${{ matrix.shard }}/4
