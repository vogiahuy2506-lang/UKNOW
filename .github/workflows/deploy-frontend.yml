name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/lint.yml'
      - '.github/workflows/test-frontend.yml'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# Keep same-service workflows ordered. The job-level lock below still prevents
# backend and frontend deploys from mutating the VPS concurrently.
concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  validate-production-ref:
    name: Validate production ref
    runs-on: ubuntu-latest
    steps:
      - name: Only deploy the current main branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deploy only accepts refs/heads/main; received $GITHUB_REF."
            exit 1
          fi

  lint:
    needs: validate-production-ref
    uses: ./.github/workflows/lint.yml

  test:
    needs: validate-production-ref
    uses: ./.github/workflows/test-frontend.yml

  deploy:
    name: Build & Deploy Frontend
    needs: [lint, test]
    concurrency:
      group: production-vps-deploy
      cancel-in-progress: false
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Reject newer frontend-relevant revision before deploy
        shell: bash
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_REF_NAME}"
          git fetch --no-tags origin "refs/heads/${REF_NAME}"
          LATEST_SHA=$(git rev-parse FETCH_HEAD)
          if [ "$LATEST_SHA" = "$GITHUB_SHA" ]; then
            echo "Commit guard passed: ${GITHUB_SHA} is current ${REF_NAME} head."
            exit 0
          fi
          if ! git diff --quiet "$GITHUB_SHA" "$LATEST_SHA" -- \
            frontend/ \
            .github/workflows/lint.yml \
            .github/workflows/test-frontend.yml \
            .github/workflows/deploy-frontend.yml; then
            echo "Stale frontend deploy refused: workflow=$GITHUB_SHA has newer frontend-relevant changes at ${LATEST_SHA}."
            exit 1
          fi
          echo "A newer main commit exists (${LATEST_SHA}) but it does not change frontend deploy inputs; continuing safely."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          provenance: false
          # Do not let a commit that becomes stale during build publish `latest`.
          # The mutable tag is promoted only after the stale-SHA guard passes.
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/uknow-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_PRIMARY_APP_HOSTS=localhost,127.0.0.1,founderai.biz,www.founderai.biz
            VITE_DEFAULT_FROM_DOMAIN=digiso.vn
            VITE_GA_MEASUREMENT_ID=${{ secrets.VITE_GA_MEASUREMENT_ID }}
            # Cờ tính năng — chỉ 'true' mới mở route, thiếu biến = đóng.
            VITE_FEATURE_ORDERS=true
            VITE_FEATURE_COURSES=true
            VITE_FEATURE_LANDING_CMS=true
            VITE_FEATURE_PRODUCTS=true
            VITE_INVOICE_VAT_ENABLED=true
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image on registry
        run: |
          echo "Verifying image on Docker Hub: ${{ secrets.DOCKERHUB_USERNAME }}/uknow-frontend:${{ github.sha }}"
          docker buildx imagetools inspect "${{ secrets.DOCKERHUB_USERNAME }}/uknow-frontend:${{ github.sha }}"

      - name: Reject newer frontend-relevant revision before VPS mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${GITHUB_REF_NAME}"
          LATEST_SHA=$(git rev-parse FETCH_HEAD)
          if [ "$LATEST_SHA" = "$GITHUB_SHA" ]; then
            exit 0
          fi
          if ! git diff --quiet "$GITHUB_SHA" "$LATEST_SHA" -- \
            frontend/ \
            .github/workflows/lint.yml \
            .github/workflows/test-frontend.yml \
            .github/workflows/deploy-frontend.yml; then
            echo "Stale frontend deploy refused: workflow=$GITHUB_SHA has newer frontend-relevant changes at ${LATEST_SHA}."
            exit 1
          fi
          echo "A newer main commit exists but frontend deploy inputs are unchanged; continuing safely."

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        # Trần riêng cho bước SSH: đây là chỗ treo lâu nhất trong thực tế (kết nối tới VPS
        # không phản hồi, hoặc lệnh docker trên VPS kẹt chờ khoá). Trần cả job không đủ —
        # có trần ở bước thì log chỉ thẳng ra thủ phạm thay vì "job hết giờ".
        timeout-minutes: 12
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/uknow-frontend:${{ github.sha }}
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Mặc định của action là 30s bắt tay / 10m chạy lệnh — đặt tường minh để đừng phụ
          # thuộc vào mặc định của phiên bản action.
          timeout: 60s
          command_timeout: 10m
          envs: DOCKERHUB_USERNAME,FRONTEND_IMAGE,EXPECTED_SHA
          script: |
            set -e
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Deploying frontend image: $FRONTEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"
            docker image inspect "$FRONTEND_IMAGE" --format 'Pulled image id: {{.Id}}'
            if docker inspect uknow-campaign-frontend > /dev/null 2>&1; then
              echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Removing old frontend container..."
              docker update --restart=no uknow-campaign-frontend || true
              for i in $(seq 1 15); do
                RUNNING=$(docker inspect --format '{{.State.Running}}' uknow-campaign-frontend 2>/dev/null || echo "false")
                [ "$RUNNING" = "false" ] && break
                CPID=$(docker inspect --format '{{.State.Pid}}' uknow-campaign-frontend 2>/dev/null || echo "")
                if [ -n "$CPID" ] && [ "$CPID" != "0" ]; then
                  kill -9 "$CPID" 2>/dev/null || sudo -n kill -9 "$CPID" 2>/dev/null || true
                fi
                sleep 1
              done
              RUNNING=$(docker inspect --format '{{.State.Running}}' uknow-campaign-frontend 2>/dev/null || echo "false")
              if [ "$RUNNING" != "false" ]; then
                docker inspect uknow-campaign-frontend --format 'Could not stop old container: pid={{.State.Pid}} status={{.State.Status}} running={{.State.Running}}'
                exit 1
              fi
              docker rm uknow-campaign-frontend
            fi
            mkdir -p /root/uknow/certbot/.well-known/acme-challenge /root/uknow/nginx-domains
            chown -R www-data:www-data /root/uknow/certbot 2>/dev/null || true

            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Starting new frontend container..."
            docker run -d \
              --name uknow-campaign-frontend \
              --network uknow_network \
              --label org.opencontainers.image.revision="$EXPECTED_SHA" \
              --restart unless-stopped \
              -p 80:80 \
              -p 443:443 \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              -v /root/uknow/certbot:/var/www/certbot:ro \
              -v /root/uknow/nginx-domains:/etc/nginx/domains:ro \
              "$FRONTEND_IMAGE"
            # Dọn image cũ >24h (không dùng plain -af để tránh xoá nhầm image
            # vừa pull của deploy song song). Cron tuần -af lo dọn sâu.
            docker image prune -af --filter "until=24h"
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Polling frontend readiness..."
            READY=false
            for i in $(seq 1 15); do
              if curl --noproxy '*' --connect-timeout 2 --max-time 3 -kfsS \
                --resolve founderai.biz:443:127.0.0.1 \
                https://founderai.biz/ > /dev/null 2>&1; then
                READY=true
                echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Smoke test passed — frontend healthy (attempt $i/15)"
                break
              fi
              sleep 1
            done
            if [ "$READY" != "true" ]; then
              echo "Smoke test FAILED after 15 attempts"
              docker logs --tail 50 uknow-campaign-frontend
              exit 1
            fi
            LOCAL_VERSION_JSON=$(curl --noproxy '*' --retry 5 --retry-delay 2 --retry-connrefused -kfsS \
              --resolve founderai.biz:443:127.0.0.1 \
              "https://founderai.biz/version.json?deploy=$EXPECTED_SHA")
            echo "Local served version: $LOCAL_VERSION_JSON"
            case "$LOCAL_VERSION_JSON" in
              *"$EXPECTED_SHA"*) echo "Local version check passed — VPS is serving $EXPECTED_SHA" ;;
              *)
                echo "Local version check FAILED — expected $EXPECTED_SHA"
                docker inspect uknow-campaign-frontend --format 'Container image: {{.Config.Image}} revision={{ index .Config.Labels "org.opencontainers.image.revision" }}'
                docker logs --tail 50 uknow-campaign-frontend
                exit 1
                ;;
            esac
            PUBLIC_VERSION_JSON=$(curl --retry 5 --retry-delay 2 --retry-connrefused -kfsS \
              "https://founderai.biz/version.json?deploy=$EXPECTED_SHA")
            echo "Public served version: $PUBLIC_VERSION_JSON"
            case "$PUBLIC_VERSION_JSON" in
              *"$EXPECTED_SHA"*) echo "Public version check passed — founderai.biz is serving $EXPECTED_SHA" ;;
              *)
                echo "Public version check FAILED — expected $EXPECTED_SHA"
                echo "If the local check passed but public failed, clear Cloudflare/cache for founderai.biz."
                exit 1
                ;;
            esac

      - name: Promote deployed image as latest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/uknow-frontend:latest" \
            "${{ secrets.DOCKERHUB_USERNAME }}/uknow-frontend:${{ github.sha }}"

  # Cùng lý do như deploy-backend.yml — xem ghi chú đầy đủ ở đó.
  notify-failure:
    name: Báo động khi deploy hỏng
    needs: [validate-production-ref, lint, test, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Mở hoặc cập nhật issue cảnh báo
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- deploy-frontend-failure-tracker -->';
            const title = '🔴 Deploy Frontend đang ĐỎ — production không nhận được bản mới';
            const body = [
              marker,
              `**Run hỏng:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Commit:** \`${context.sha.slice(0, 8)}\``,
              '',
              'Kiểm bản frontend production đang chạy: `curl -s https://founderai.biz/version.json`',
              '',
              'Đóng issue này sau khi có một run xanh.',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((i) => (i.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.notice(`Da them comment vao issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.notice(`Da mo issue #${created.number}`);
            }
