name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'server/scripts/**'
      - '.github/workflows/test-backend.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      skip_integration:
        description: 'Bỏ qua integration test (fast-path cho hotfix) — MẶC ĐỊNH chạy đủ, chỉ bật khi thật sự gấp'
        type: boolean
        required: false
        default: false

# Serialize same-service workflows so an older commit cannot finish its tests
# after a newer commit and deploy over it. The deploy job below also uses a
# shared VPS lock for backend/frontend mutations.
concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  validate-production-ref:
    name: Validate production ref
    runs-on: ubuntu-latest
    steps:
      - name: Only deploy the current main branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deploy only accepts refs/heads/main; received $GITHUB_REF."
            exit 1
          fi

  test:
    needs: validate-production-ref
    uses: ./.github/workflows/test-backend.yml
    with:
      skip_integration: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_integration || false }}

  deploy:
    name: Build & Deploy Backend
    needs: test
    concurrency:
      group: production-vps-deploy
      cancel-in-progress: false
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Reject newer backend-relevant revision before deploy
        shell: bash
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_REF_NAME}"
          git fetch --no-tags origin "refs/heads/${REF_NAME}"
          LATEST_SHA=$(git rev-parse FETCH_HEAD)
          if [ "$LATEST_SHA" = "$GITHUB_SHA" ]; then
            echo "Commit guard passed: ${GITHUB_SHA} is current ${REF_NAME} head."
            exit 0
          fi
          if ! git diff --quiet "$GITHUB_SHA" "$LATEST_SHA" -- \
            backend/ server/scripts/ \
            .github/workflows/test-backend.yml \
            .github/workflows/deploy-backend.yml; then
            echo "Stale backend deploy refused: workflow=$GITHUB_SHA has newer backend-relevant changes at ${LATEST_SHA}."
            exit 1
          fi
          echo "A newer main commit exists (${LATEST_SHA}) but it does not change backend deploy inputs; continuing safely."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          provenance: false
          # Push only an immutable tag while the workflow is still subject to
          # stale-SHA checks. `latest` is promoted after the final guard below.
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/uknow-backend:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            LP_APEX_FIXED_IP=${{ secrets.LP_APEX_FIXED_IP }}
            LP_CNAME_TARGET=${{ secrets.LP_CNAME_TARGET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image on registry
        run: |
          echo "Verifying image on Docker Hub: ${{ secrets.DOCKERHUB_USERNAME }}/uknow-backend:${{ github.sha }}"
          docker buildx imagetools inspect "${{ secrets.DOCKERHUB_USERNAME }}/uknow-backend:${{ github.sha }}"

      - name: Reject newer backend-relevant revision before VPS mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${GITHUB_REF_NAME}"
          LATEST_SHA=$(git rev-parse FETCH_HEAD)
          if [ "$LATEST_SHA" = "$GITHUB_SHA" ]; then
            exit 0
          fi
          if ! git diff --quiet "$GITHUB_SHA" "$LATEST_SHA" -- \
            backend/ server/scripts/ \
            .github/workflows/test-backend.yml \
            .github/workflows/deploy-backend.yml; then
            echo "Stale backend deploy refused: workflow=$GITHUB_SHA has newer backend-relevant changes at ${LATEST_SHA}."
            exit 1
          fi
          echo "A newer main commit exists but backend deploy inputs are unchanged; continuing safely."

      - name: Upload SSL scripts to VPS
        uses: appleboy/scp-action@v0.1.7
        timeout-minutes: 5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "server/scripts/ssl-auto-provision.sh,server/scripts/ssl-provision-pending.sh"
          target: "/tmp/uknow-ssl-scripts"
          strip_components: 2

      - name: Recheck backend-relevant revision immediately before VPS mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${GITHUB_REF_NAME}"
          LATEST_SHA=$(git rev-parse FETCH_HEAD)
          if [ "$LATEST_SHA" = "$GITHUB_SHA" ]; then
            exit 0
          fi
          if ! git diff --quiet "$GITHUB_SHA" "$LATEST_SHA" -- \
            backend/ server/scripts/ \
            .github/workflows/test-backend.yml \
            .github/workflows/deploy-backend.yml; then
            echo "Stale backend deploy refused: workflow=$GITHUB_SHA has newer backend-relevant changes at ${LATEST_SHA}."
            exit 1
          fi
          echo "A newer main commit exists but backend deploy inputs are unchanged; continuing safely."

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        # Trần riêng cho bước SSH: đây là chỗ treo lâu nhất trong thực tế (kết nối tới VPS
        # không phản hồi, hoặc lệnh docker trên VPS kẹt chờ khoá). Trần cả job không đủ —
        # có trần ở bước thì log chỉ thẳng ra thủ phạm thay vì "job hết giờ".
        # Rộng hơn frontend vì bước này còn chạy migration.
        timeout-minutes: 15
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/uknow-backend:${{ github.sha }}
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Mặc định của action là 30s bắt tay / 10m chạy lệnh — đặt tường minh để đừng phụ
          # thuộc vào mặc định của phiên bản action.
          timeout: 60s
          command_timeout: 13m
          envs: DOCKERHUB_USERNAME,BACKEND_IMAGE,EXPECTED_SHA
          script: |
            set -e
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Deploying backend image: $BACKEND_IMAGE"
            docker pull "$BACKEND_IMAGE"
            docker image inspect "$BACKEND_IMAGE" --format 'Pulled image id: {{.Id}}'
            mkdir -p /root/uknow/scripts /root/uknow/certbot/.well-known/acme-challenge /root/uknow/nginx-domains
            cp /tmp/uknow-ssl-scripts/ssl-auto-provision.sh /root/uknow/scripts/ssl-auto-provision.sh
            cp /tmp/uknow-ssl-scripts/ssl-provision-pending.sh /root/uknow/scripts/ssl-provision-pending.sh
            chmod +x /root/uknow/scripts/ssl-auto-provision.sh /root/uknow/scripts/ssl-provision-pending.sh
            chown -R www-data:www-data /root/uknow/certbot 2>/dev/null || true
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] SSL scripts deployed to /root/uknow/scripts"
            # ── Migration chạy TRƯỚC khi hạ container cũ ──────────────────────
            # Nếu migration hỏng, `set -e` dừng deploy tại đây và container cũ vẫn
            # đang phục vụ. Hạ container trước rồi mới migrate thì migration hỏng
            # = web sập cho tới khi có người vào tay.
            # Chạy bằng ĐÚNG image vừa pull nên file migration luôn khớp code sắp chạy.
            BACKUP_DIR="/root/uknow/backups/billing-anchor-repair"
            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Tạo backup + preflight manifest cho các row migration 174 có thể thay đổi..."
            # The production image deliberately runs as the unprivileged
            # `node` user, while this VPS-only backup directory is root:0700.
            # Run only the transient backup writer as root so its JSON remains
            # private; the application container never receives this mount.
            # Mount at the same absolute VPS path: backup_path persisted in the
            # DB must point to the recoverable host file, never /backups inside
            # this short-lived container.
            PREFLIGHT_OUTPUT="$(docker run --rm \
              --user 0:0 \
              --network uknow_network \
              -e BILLING_ANCHOR_BACKUP_DIR="$BACKUP_DIR" \
              -v /root/uknow/backend/.env:/app/.env \
              -v "$BACKUP_DIR":"$BACKUP_DIR" \
              "$BACKEND_IMAGE" node scripts/backupBillingAnchorRepair.js)"
            printf '%s\n' "$PREFLIGHT_OUTPUT"
            RUN_BILLING_ANCHOR_AUDIT=false
            if printf '%s\n' "$PREFLIGHT_OUTPUT" | grep -Fxq 'BILLING_ANCHOR_PREFLIGHT_STATUS=prepared'; then
              RUN_BILLING_ANCHOR_AUDIT=true
            fi
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Chạy migration bằng image mới (container cũ vẫn đang phục vụ; migration chỉ sửa row khớp preflight manifest)..."
            docker run --rm \
              --name uknow-migrate \
              --network uknow_network \
              -v /root/uknow/backend/.env:/app/.env \
              "$BACKEND_IMAGE" node scripts/migrate.js
            # Migration 174 deliberately skips a row that changed after the
            # preflight snapshot. Audit only the deploy that created a fresh
            # preflight; later releases must not put a full billing scan on the
            # critical path merely because the one-time repair once existed.
            if [ "$RUN_BILLING_ANCHOR_AUDIT" = "true" ]; then
              echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Audit billing anchors sau migration (read-only)..."
              docker run --rm \
                --network uknow_network \
                -v /root/uknow/backend/.env:/app/.env \
                "$BACKEND_IMAGE" node scripts/auditBillingCycles.js
            else
              echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Bỏ qua billing audit: migration 174 đã áp dụng từ release trước."
            fi
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Migration hoàn tất — bắt đầu đổi container"
            # Đổi tên + STOP (không rm -f) container cũ thay vì xoá thẳng: STOP đã giải
            # phóng port 5001 (đủ để container mới bind), nhưng container cũ vẫn còn để
            # khôi phục tức thì nếu readiness check của container mới thất bại bên dưới.
            # `/api/health` giờ đóng tới khi initializePostListenRuntime() (worker/scheduler/
            # Zalo restore) xong hẳn — xem runtimeReadiness.util.js — nên container mới có
            # thể bind cổng thành công nhưng vẫn chưa sẵn sàng nhận traffic thật; trước đây
            # xoá container cũ trước rồi start container mới nghĩa là mọi thất bại readiness
            # đều làm mất backend hoàn toàn (không còn gì để rollback).
            #
            # Tên standby dùng riêng "-ci-swap" (KHÔNG phải "-standby"): script
            # backend/scripts/ops/hot_swap_rollback.sh dùng đúng tên
            # "uknow-campaign-backend-standby" làm đường cứu hộ khẩn cấp thủ công và
            # fail-closed nếu thấy tên đó đã tồn tại. Trùng tên sẽ khiến một standby
            # CI để sót khoá luôn lối thoát khẩn cấp đó, và ngược lại.
            CI_STANDBY_NAME="uknow-campaign-backend-ci-swap"
            if docker inspect "$CI_STANDBY_NAME" > /dev/null 2>&1; then
              echo "::error::Phát hiện $CI_STANDBY_NAME còn sót từ lượt deploy trước (có thể do step bị huỷ giữa chừng)."
              echo "Dán thẳng lệnh dưới đây trên VPS — nó tự kiểm tra health rồi mới chọn nhánh, không cần bạn tự đọc trạng thái rồi chọn tay (chọn nhầm nhánh là xoá mất bản đang chạy tốt):"
              echo "  if curl -sf http://localhost:5001/api/health >/dev/null; then docker rm -f $CI_STANDBY_NAME; echo 'uknow-campaign-backend đang healthy — đã xoá standby thừa.'; else docker rm -f uknow-campaign-backend 2>/dev/null; docker rename $CI_STANDBY_NAME uknow-campaign-backend && docker update --restart=unless-stopped uknow-campaign-backend && docker start uknow-campaign-backend && echo 'Đã khôi phục uknow-campaign-backend từ standby.'; fi"
              exit 1
            fi
            if docker inspect uknow-campaign-backend-standby > /dev/null 2>&1; then
              echo "::error::Phát hiện uknow-campaign-backend-standby đang tồn tại — tên này dành riêng cho hot_swap_rollback.sh (rollback khẩn cấp thủ công), có thể một lần chạy script đó trước đây bị ngắt giữa chừng."
              echo "Kiểm tra container nào đang thực sự phục vụ trên VPS:"
              echo "  docker ps -a --filter name=uknow-campaign-backend"
              echo "Reconcile thủ công theo đúng logic khôi phục của chính hot_swap_rollback.sh (hàm restore_previous_container trong backend/scripts/ops/hot_swap_rollback.sh) rồi mới chạy lại deploy tự động."
              exit 1
            fi

            HAD_PREVIOUS_CONTAINER=false
            MUTATION_IN_PROGRESS=false
            # Trap phòng khi SSH mất kết nối / step bị huỷ giữa lúc đang đổi container:
            # nếu tiến trình nhận TERM/INT khi mutation đang dở, cố hết sức phục hồi
            # container cũ thay vì để VPS kẹt ở trạng thái nửa vời (mất cả cũ lẫn mới).
            # Chỉ là lưới an toàn best-effort — không tự bảo đảm bắt được mọi kiểu mất
            # kết nối SSH (ví dụ đứt mạng cứng không kịp gửi tín hiệu).
            # QUAN TRỌNG: trap phải `exit 1` ở cuối, không chỉ chạy lệnh khôi phục rồi
            # thôi — nếu không, sau khi trap xử lý xong, bash tiếp tục chạy phần script
            # còn lại NGAY TỪ CHỖ bị ngắt như chưa có gì xảy ra (đây là hành vi trap mặc
            # định của bash, đã tự kiểm bằng cách gửi SIGTERM thật giữa lúc "docker run"
            # đang chạy: thiếu `exit 1`, script tự phục hồi container cũ rồi vẫn đi tiếp
            # tới bước poll health/dọn standby và báo "deploy thành công" — tức CI xanh
            # giả trong khi container mới chưa từng thực sự chạy).
            trap 'if [ "$MUTATION_IN_PROGRESS" = "true" ]; then echo "::error::Tín hiệu ngắt giữa lúc đổi container."; if [ "$HAD_PREVIOUS_CONTAINER" = "true" ] && docker inspect "$CI_STANDBY_NAME" > /dev/null 2>&1; then echo "Cố khôi phục $CI_STANDBY_NAME."; docker rename "$CI_STANDBY_NAME" uknow-campaign-backend 2>/dev/null || true; docker update --restart=unless-stopped uknow-campaign-backend 2>/dev/null || true; docker start uknow-campaign-backend 2>/dev/null || true; fi; exit 1; fi' TERM INT HUP

            if docker inspect uknow-campaign-backend > /dev/null 2>&1; then
              HAD_PREVIOUS_CONTAINER=true
              MUTATION_IN_PROGRESS=true
              echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Chuyển container cũ sang standby (đổi tên + stop, chưa xoá)..."
              docker update --restart=no uknow-campaign-backend || true
              docker rename uknow-campaign-backend "$CI_STANDBY_NAME" || true
              docker stop "$CI_STANDBY_NAME" || true
              sleep 2
              # Fallback: nếu daemon conflict khiến stop thất bại, kill PID trực tiếp
              if [ "$(docker inspect "$CI_STANDBY_NAME" --format '{{.State.Running}}' 2>/dev/null || echo false)" = "true" ]; then
                CPID=$(docker inspect "$CI_STANDBY_NAME" --format '{{.State.Pid}}' 2>/dev/null || echo "")
                if [ -n "$CPID" ] && [ "$CPID" != "0" ]; then
                  echo "Fallback: kill -9 pid=$CPID"
                  kill -9 "$CPID" 2>/dev/null || true
                  sleep 2
                fi
              fi
              if [ "$(docker inspect "$CI_STANDBY_NAME" --format '{{.State.Running}}' 2>/dev/null || echo false)" = "true" ]; then
                docker inspect "$CI_STANDBY_NAME" --format 'Could not stop old container: pid={{.State.Pid}} status={{.State.Status}} running={{.State.Running}}'
                exit 1
              fi
            fi

            # Rollback dùng chung cho MỌI đường thất bại bên dưới (docker run tự nó
            # lỗi, container không bao giờ healthy, hoặc container rớt readiness ngay
            # sau khi vừa lên) — trước đây chỉ nhánh "không healthy sau 60s" có rollback;
            # "docker run" thất bại thẳng thì `set -e` giết script trước khi chạm tới
            # rollback, để lại VPS không còn container nào chạy cả.
            # Poll cùng ngân sách 20×3s=60s như đường forward: trước đây rollback chỉ
            # có 10×2s=20s, ngắn hơn hẳn thời gian initializePostListenRuntime() cần,
            # dễ báo nhầm "rollback thất bại" trong khi container cũ chỉ đơn giản là
            # đang khởi động lại.
            rollback_to_standby() {
              local reason="$1"
              echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] ${reason} — rolling back"
              docker logs --tail 50 uknow-campaign-backend 2>/dev/null || true
              docker update --restart=no uknow-campaign-backend 2>/dev/null || true
              docker rm -f uknow-campaign-backend 2>/dev/null || true
              if [ "$HAD_PREVIOUS_CONTAINER" = "true" ]; then
                echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Khôi phục container cũ từ standby..."
                docker rename "$CI_STANDBY_NAME" uknow-campaign-backend || true
                docker update --restart=unless-stopped uknow-campaign-backend || true
                docker start uknow-campaign-backend || true
                ROLLED_BACK=false
                for i in $(seq 1 40); do
                  if curl --connect-timeout 2 --max-time 4 -sf http://localhost:5001/api/health > /dev/null 2>&1; then
                    ROLLED_BACK=true
                    break
                  fi
                  sleep 3
                done
                if [ "$ROLLED_BACK" = "true" ]; then
                  echo "Rollback thành công — container cũ đã phục vụ trở lại. Deploy vẫn FAIL để CI báo động."
                else
                  echo "::error::Rollback container cũ KHÔNG phản hồi healthy — cần can thiệp thủ công ngay trên VPS."
                  docker logs --tail 50 uknow-campaign-backend || true
                fi
              else
                echo "::error::Không có container cũ để rollback (đây là lần deploy đầu tiên) — backend hiện KHÔNG chạy."
              fi
              MUTATION_IN_PROGRESS=false
              trap - TERM INT HUP
              exit 1
            }

            DOCKER_GID="$(stat -c '%g' /var/run/docker.sock 2>/dev/null || echo 0)"
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Starting new backend container..."
            if ! docker run -d \
              --name uknow-campaign-backend \
              --network uknow_network \
              --group-add "$DOCKER_GID" \
              --label org.opencontainers.image.revision="$EXPECTED_SHA" \
              --restart unless-stopped \
              -e SKIP_MIGRATIONS=true \
              -p 5001:5001 \
              -v /root/uknow/backend/.env:/app/.env \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v /root/uknow/backend/uploads:/app/uploads \
              -v /root/uknow/backend/temp_uploads:/app/temp_uploads \
              -v /root/uknow/secrets:/app/secrets:ro \
              -v /root/uknow/scripts/ssl-auto-provision.sh:/opt/uknow/ssl-auto-provision.sh:ro \
              "$BACKEND_IMAGE"; then
              rollback_to_standby "docker run failed"
            fi

            # Ngân sách 40×3s=120s (không phải 60s): BullMQ (outboundMessageQueue +
            # kbDocumentQueue) mỗi cái có connectTimeout mặc định 60s trước khi
            # markRuntimeReady() được gọi (xem runtimeReadiness.util.js). Một lần Redis
            # chậm-nhưng-vẫn-lên có thể chiếm gần hết 60s của MỘT queue; ngân sách 60s
            # cũ không còn margin cho DB connect + validate + scheduler init chạy trước
            # đó, dễ rollback nhầm một bản deploy khoẻ mạnh chỉ vì Redis trả lời chậm.
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Polling backend readiness (DB recovery + Redis connect có thể mất ~30-60s)..."
            READY=false
            START_TIME=$(date +%s)
            for i in $(seq 1 40); do
              if curl --connect-timeout 2 --max-time 4 -sf http://localhost:5001/api/health > /dev/null 2>&1; then
                READY=true
                ELAPSED=$(( $(date +%s) - START_TIME ))
                echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Smoke test passed — backend healthy after ${ELAPSED}s (attempt $i/40)"
                break
              fi
              sleep 3
            done
            if [ "$READY" != "true" ]; then
              ELAPSED=$(( $(date +%s) - START_TIME ))
              rollback_to_standby "Smoke test FAILED after ${ELAPSED}s (40 attempts)"
            fi

            # Cửa sổ ổn định: endpoint vừa healthy không có nghĩa sẽ tiếp tục healthy —
            # container có thể crash ngay sau readiness. Chờ thêm một nhịp rồi kiểm lại
            # TRƯỚC KHI xoá standby; xoá standby ngay thì một crash-ngay-sau-readiness
            # sẽ không còn đường cứu hộ.
            sleep 3
            if ! docker inspect uknow-campaign-backend --format '{{.State.Running}}' 2>/dev/null | grep -qx 'true' \
               || ! curl --connect-timeout 2 --max-time 4 -sf http://localhost:5001/api/health > /dev/null 2>&1; then
              rollback_to_standby "Container mất readiness ngay trong cửa sổ ổn định sau khởi động"
            fi

            MUTATION_IN_PROGRESS=false
            trap - TERM INT HUP
            if [ "$HAD_PREVIOUS_CONTAINER" = "true" ]; then
              docker rm -f "$CI_STANDBY_NAME" || true
            fi
            # Dọn image cũ >24h (không dùng plain -af để tránh xoá nhầm image
            # vừa pull của deploy song song). Cron tuần -af lo dọn sâu. Chạy SAU khi
            # readiness đã pass để không xoá mất image đang cần dùng cho rollback ở trên.
            docker image prune -af --filter "until=24h"

      - name: Promote deployed image as latest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/uknow-backend:latest" \
            "${{ secrets.DOCKERHUB_USERNAME }}/uknow-backend:${{ github.sha }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Cảnh báo khi deploy đỏ — thêm 04/09/2026.
  #
  # Vì sao cần: deploy backend đỏ 6 run liên tiếp trong ~10 tiếng (03/09 16:59 →
  # 04/09 03:30) mà không ai biết, trong khi deploy frontend vẫn lên đều. Lệch phiên
  # bản đó khoá modal "Bổ sung số điện thoại" của mọi user không phải admin trên
  # production. Bản thân sự cố không do một dòng code nào — do KHÔNG AI ĐƯỢC BÁO.
  #
  # Dùng GitHub Issue vì repo chưa có secret thông báo nào (chỉ DockerHub + VPS), còn
  # GITHUB_TOKEN thì luôn có sẵn. Issue mở ra sẽ email cho người theo dõi repo.
  # Gom vào MỘT issue duy nhất: đỏ liên tiếp thì thêm comment chứ không đẻ issue mới.
  notify-failure:
    name: Báo động khi deploy hỏng
    needs: [validate-production-ref, test, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Mở hoặc cập nhật issue cảnh báo
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- deploy-backend-failure-tracker -->';
            const title = '🔴 Deploy Backend đang ĐỎ — production không nhận được bản mới';
            const body = [
              marker,
              `**Run hỏng:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Commit:** \`${context.sha.slice(0, 8)}\``,
              '',
              'Deploy backend đỏ nghĩa là **production vẫn đang chạy bản cũ**, trong khi',
              'deploy frontend dùng workflow riêng và vẫn lên bình thường — lệch phiên bản',
              'kiểu này đã một lần khoá toàn bộ user không phải admin (04/09/2026).',
              '',
              'Kiểm bản backend production đang chạy:',
              '```bash',
              "curl -s -X POST https://founderai.biz/api/auth/register \\",
              "  -H 'Content-Type: application/json' -d '{}' | grep -o '\"path\":\"[a-z]*\"' | sort -u",
              '```',
              '',
              'Đóng issue này sau khi có một run xanh.',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((i) => (i.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.notice(`Da them comment vao issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.notice(`Da mo issue #${created.number}`);
            }
