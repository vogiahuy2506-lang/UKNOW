name: Lint

on:
  push:
    branches: [main]
    # Xem ghi chú cùng loại ở test-backend.yml — deploy-frontend.yml đã gọi workflow này
    # qua `uses:` cho mọi push chạm frontend/**, nên bỏ để khỏi chạy hai lần.
    paths-ignore:
      - 'frontend/**'
      - '.github/workflows/lint.yml'
      - '.github/workflows/test-frontend.yml'
      - '.github/workflows/deploy-frontend.yml'
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-frontend:
    name: ESLint (frontend)
    timeout-minutes: 10
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
